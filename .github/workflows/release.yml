name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['apps/**', 'shared/**', 'scripts/**', 'service/**', 'android/**', 'package.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag à publier (ex. v1.4.3) — vide = version suivante'
        required: false
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.t.outputs.name }}
      skip: ${{ steps.t.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: t
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          skip=false
          if [ "$REF_TYPE" = "tag" ]; then T="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then T="$INPUT_TAG"
          else
            # push sur main : si le commit porte déjà un tag v*, c'est lui qui publie (pas de doublon)
            if [ "$EVENT" = "push" ] && [ -n "$(git tag --points-at HEAD 'v*')" ]; then skip=true; fi
            L=$(git tag --list 'v*' --sort=-v:refname | head -1); L=${L:-v1.0.0}
            IFS=. read -r a b c <<< "${L#v}"; T="v$a.$b.$((c+1))"
          fi
          echo "name=$T" >> "$GITHUB_OUTPUT"; echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "Tag : $T (skip=$skip)"
  build:
    needs: tag
    if: needs.tag.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: node scripts/build.mjs
        env:
          RELEASE_TAG: ${{ needs.tag.outputs.name }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
  android:
    needs: [tag, build]
    if: needs.tag.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TVCast.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.name }}
          files: TVCast.apk
