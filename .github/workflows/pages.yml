name: Page TVCast (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/rtcsig.js', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site/cast
          cp web/cast/index.html web/cast/cast.js shared/rtcsig.js site/cast/
          sed -i 's#data-repo=""##' site/cast/index.html
          sed -i "s#<html lang=\"fr\">#<html lang=\"fr\" data-repo=\"${GITHUB_REPOSITORY}\">#" site/cast/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
