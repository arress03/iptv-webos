<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>F-Sonic</title>
<meta name="viewport" content="width=1920">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#eef1f7;font:28px system-ui,sans-serif;overflow:hidden}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:0 160px}
#msg b{color:#6ea0ff}
</style></head>
<body>
<div id="msg">Chargement de F-Sonic…</div>
<script src="config.js"></script>
<script>
(function () {
  var c = window.FSONIC || {}, u = String(c.url || '');
  var msg = document.getElementById('msg');
  if (!/^https:\/\//i.test(u) || /REMPLACE-MOI/.test(u)) { msg.innerHTML = 'Adresse du jeu non configurée.<br>Édite <b>config.js</b> (ligne <b>url</b>) puis reconstruis l’app.'; return; }
  if (c.mode === 'frame') {
    var f = document.createElement('iframe'); f.src = u; f.setAttribute('allow', 'autoplay; fullscreen; gamepad');
    // pas de allow-popups : les fenêtres publicitaires sont bloquées
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-modals');
    var loads = 0, note = document.createElement('div');
    note.style.cssText = 'position:fixed;left:50%;bottom:50px;transform:translateX(-50%);background:rgba(20,24,33,.92);padding:14px 30px;border-radius:30px;font-size:24px;display:none;z-index:5';
    note.textContent = 'Page bloquée : retour à l’accueil du jeu';
    // un événement "load" par chargement de page dans le cadre (même sans pouvoir lire son adresse)
    f.addEventListener('load', function () {
      loads++;
      if (c.lockToHome !== false && loads > 1) { f.src = u; loads = 0; note.style.display = 'block'; setTimeout(function () { note.style.display = 'none'; }, 3500); }
    });
    document.body.appendChild(f); document.body.appendChild(note); msg.style.display = 'none';
  } else location.replace(u);
})();
</script>
</body></html>
