<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>TVCast — partager mon écran</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: dark; --bg:#0b0d12; --pn:#141821; --pn2:#1b2130; --tx:#eef1f7; --mut:#8f98ab; --acc:#4f8cff; --ok:#4cd68d; --err:#ff6b6b; }
* { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--tx); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; min-height:100vh; display:flex; justify-content:center; }
main { width:100%; max-width:520px; padding:28px 18px 40px; } h1 { font-size:30px; margin:6px 0 4px; } .sub { color:var(--mut); margin:0 0 22px; }
.card { background:var(--pn); border-radius:16px; padding:18px; margin-bottom:16px; } label { display:block; color:var(--mut); font-size:14px; margin:0 0 6px; }
input[type=text], select { width:100%; background:var(--pn2); color:var(--tx); border:2px solid transparent; border-radius:12px; padding:14px; font:inherit; }
input[type=text] { font:700 30px ui-monospace,Consolas,monospace; letter-spacing:.2em; text-align:center; text-transform:uppercase; } input:focus, select:focus { outline:none; border-color:var(--acc); }
.row { display:flex; gap:12px; } .row > div { flex:1; } .chk { display:flex; align-items:center; gap:10px; margin-top:14px; color:var(--tx); } .chk input { width:20px; height:20px; }
button { width:100%; border:0; border-radius:14px; padding:16px; font:600 18px inherit; font-family:inherit; background:var(--acc); color:#fff; cursor:pointer; } button:disabled { opacity:.5; }
button.stop { background:var(--err); } #st { margin-top:14px; color:var(--mut); min-height:1.4em; } #st.ok { color:var(--ok); } #st.err { color:var(--err); }
a { color:#6ea0ff; } small { color:var(--mut); display:block; margin-top:10px; } .hidden { display:none; }
</style></head>
<body><main>
  <h1>TVCast</h1><p class="sub">Partage ton écran sur la télé.</p>
  <div id="nosup" class="card hidden"></div>
  <div class="card" id="form">
    <label for="code">Code affiché sur la télé</label>
    <input id="code" type="text" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD EFGH" inputmode="text">
    <div class="row" style="margin-top:16px">
      <div><label for="q">Qualité</label><select id="q"><option value="720">720p</option><option value="1080" selected>1080p</option></select></div>
      <div><label for="fps">Images/s</label><select id="fps"><option>15</option><option selected>30</option><option>60</option></select></div>
    </div>
    <label class="chk"><input id="aud" type="checkbox" checked> Partager aussi le son (si le navigateur le permet)</label>
    <div style="margin-top:18px"><button id="go">Partager mon écran</button><button id="stop" class="stop hidden">Arrêter le partage</button></div>
    <div id="st"></div>
  </div>
  <p class="sub" style="font-size:14px">Android : le navigateur ne sait pas partager l’écran, installe l’app TVCast (<a id="apk" href="#">dernière version</a>).<br>Le flux vidéo va directement de ton appareil à la télé (même Wi‑Fi) ; seul l’échange de connexion passe par un relais.</p>
</main>
<script src="rtcsig.js"></script><script src="cast.js"></script>
</body></html>
